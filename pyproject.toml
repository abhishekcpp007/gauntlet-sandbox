[project]
name = "gauntlet-sandbox"
version = "0.1.0"
description = "Run AI agent actions inside locked-down Docker containers and record every step as a replayable trajectory."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek", email = "akvikramaditya007cppcoder@gmail.com" }]
keywords = ["agents", "sandbox", "docker", "reinforcement-learning", "trajectories", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["docker>=7.1", "pydantic>=2.6"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
gauntlet-sandbox = "gauntlet_sandbox.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekcpp007/gauntlet-sandbox"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
